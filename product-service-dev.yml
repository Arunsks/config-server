spring:
    application:
        name: product-service

    datasource:
        url: jdbc:mysql://localhost:3306/product
        username: root
        password: arunsks98
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    # For Spring Boot 2.x (Sleuth + Zipkin)
    zipkin:
        base-url: http://localhost:9411
        enabled: true

    sleuth:
        sampler:
            probability: 1.0

server:
    port: 8082

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka
        register-with-eureka: true
        fetch-registry: true

management:
    tracing:
        sampling:
            probability: 1.0
    endpoints:
        web:
            exposure:
                include: "*"

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{traceId},%X{spanId}] %logger{36} - %msg%n"
